<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Marketplace illustration">
  <defs>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff7ec" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe6f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f7d7ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeacc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd0d8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- ambient blooms -->
  <circle cx="120" cy="130" r="130" fill="#ffffff" opacity="0.18"/>
  <circle cx="490" cy="470" r="160" fill="#ffffff" opacity="0.12"/>

  <!-- back card -->
  <g transform="translate(140 110) rotate(-8)">
    <rect width="240" height="320" rx="28" fill="url(#card2)" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
    <rect x="22" y="22" width="196" height="160" rx="18" fill="#ffffff" opacity="0.7"/>
    <g transform="translate(60 60)" stroke="#8e44ad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65">
      <circle cx="60" cy="40" r="22"/>
      <path d="M10 110c15-22 40-22 60-22s45 0 60 22"/>
    </g>
    <rect x="22" y="200" width="120" height="14" rx="7" fill="#ffffff" opacity="0.85"/>
    <rect x="22" y="222" width="76" height="12" rx="6" fill="#ffffff" opacity="0.6"/>
    <rect x="22" y="266" width="86" height="28" rx="14" fill="#ff007f" opacity="0.85"/>
  </g>

  <!-- middle card -->
  <g transform="translate(220 200) rotate(4)">
    <rect width="260" height="340" rx="30" fill="url(#card1)" stroke="#ffffff" stroke-width="3"/>
    <rect x="24" y="24" width="212" height="172" rx="20" fill="#fde0e8"/>
    <g transform="translate(60 50)" stroke="#ff007f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
      <path d="M30 80c0-30 30-30 60-50 0 60-30 80-60 50z"/>
      <path d="M30 80l-10 28"/>
      <circle cx="80" cy="100" r="8" fill="#ff007f"/>
    </g>
    <rect x="24" y="216" width="150" height="16" rx="8" fill="#1e1e1e" opacity="0.85"/>
    <rect x="24" y="240" width="90" height="12" rx="6" fill="#1e1e1e" opacity="0.4"/>
    <rect x="24" y="282" width="100" height="32" rx="16" fill="#8e44ad" opacity="0.95"/>
    <text x="74" y="302" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">$48</text>
  </g>

  <!-- floating accent: heart -->
  <g transform="translate(420 130)" filter="url(#soft)">
    <rect x="-22" y="-22" width="64" height="64" rx="16" fill="#ffffff"/>
    <path d="M10 32c-12-8-20-16-20-26 0-7 5-12 12-12 5 0 8 3 8 8 0-5 3-8 8-8 7 0 12 5 12 12 0 10-8 18-20 26z" fill="#ff007f"/>
  </g>

  <!-- floating accent: spark -->
  <g transform="translate(140 480)" filter="url(#soft)">
    <rect x="-22" y="-22" width="64" height="64" rx="16" fill="#ffffff"/>
    <path d="M10 -8l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ff9f43"/>
    <circle cx="22" cy="20" r="4" fill="#8e44ad"/>
  </g>

  <!-- back card 3 -->
  <g transform="translate(420 360) rotate(10)" opacity="0.95">
    <rect width="180" height="220" rx="24" fill="url(#card3)" stroke="#ffffff" stroke-width="3"/>
    <rect x="18" y="18" width="144" height="120" rx="16" fill="#ffffff" opacity="0.65"/>
    <g transform="translate(50 40)" stroke="#ff9f43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75">
      <path d="M0 60l30-50 30 30 20-20"/>
    </g>
    <rect x="18" y="156" width="80" height="12" rx="6" fill="#1e1e1e" opacity="0.7"/>
    <rect x="18" y="178" width="50" height="10" rx="5" fill="#1e1e1e" opacity="0.4"/>
  </g>
</svg>
